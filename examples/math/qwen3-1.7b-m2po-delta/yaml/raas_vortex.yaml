# ============================================================================
# RaaS config with Vortex sparse attention enabled.
# Based on raas.yaml for math / qwen3-1.7b-m2po-delta.
#
# Use this file instead of raas.yaml when launching the RaaS service to test
# the AstraFlow -> SGLang -> Vortex integration path.
# ============================================================================

rollout:
  max_concurrent_rollouts: 1024
  # Cap concurrent eval prefills to bound peak KV pressure during the
  # ~3.5k-item eval burst (5 datasets x repeat=4) — default 128 OOMs sglang.
  max_concurrent_evals: 64
  pause_grace_period: 3
  # Adaptive availability — drive /availability off sglang /get_load.
  enable_adaptive_availability: true
  target_waiting_queue_per_dp: 4
  adaptive_step_size: 4
  load_cache_ttl_ms: 100

engine:
  model0:
    backend: sglang
    data_parallel_size: 4

sglang:
  context_length: 16384
  page_size: 16
  attention_backend: flashinfer
  mem_fraction_static: 0.8
  max_running_requests: null
  skip_tokenizer_init: true
  # Passed through AstraFlow as --vortex-config JSON. Importing vortex_torch in
  # astraflow.raas.entrypoint installs the SGLang ServerArgs adapter that turns
  # this dict into a VortexConfig.
  vortex:
    module_name: gqa_block_sparse_attention
    topk_val: 30
    block_size: 16
    attention_backend: flashinfer
    impl_backend: triton
    workload_chunk_size: 32
    dtype: bfloat16
    layers_skip:
      - 0
    block_reserved_bos: 1
    block_reserved_eos: 1
    max_seq_lens: 16384
    max_topk_val: 256
